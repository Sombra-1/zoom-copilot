name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile and lint
        run: |
          python -m py_compile zoom_copilot.py setup.py
          python -m tabnanny zoom_copilot.py setup.py tests
          python -m pyflakes zoom_copilot.py setup.py tests
      - name: Test
        run: python -m unittest discover -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security scanner
        run: python -m pip install -r requirements-dev.txt
      - name: Scan for high-severity findings
        run: python -m bandit -q -lll -r zoom_copilot.py setup.py
